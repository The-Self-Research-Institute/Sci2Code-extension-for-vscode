# Zotero Replica Dataserver — standalone Zotero-compatible reference-management
# microservice. Fully decoupled from OntoCode: its own MongoDB database, its
# own JWT issuance/validation, its own build (no parent multi-module project).

spring.application.name=dataserver

# JWT secret used both to ISSUE tokens (AuthController/JwtService.generateToken)
# and to VALIDATE them (JwtAuthenticationFilter/JwtService.parseAndValidate).
# Generate one with: openssl rand -base64 48
# A future OntoCode auth integration can mint compatible tokens by signing
# with this same secret and the same claim shape (email/userId/roles) —
# no dataserver code changes required for that swap.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Dedicated MongoDB database owned entirely by the Zotero Replica — no
# dependency on, or shared collections with, any OntoCode MongoDB database.
# All collections use a "ds_" prefix (ds_libraries, ds_items, ds_collections,
# ds_tags is derived from ds_items, ds_groups, ds_searches, ds_deleted_log,
# ds_users, ds_attachments GridFS bucket).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/zotero_replica}
spring.data.mongodb.auto-index-creation=true

# Server Port - MUST be in properties format, not YAML.
# 9089 deliberately avoids OntoCode's own port range (80=gateway, 8083=editor,
# 8084=swrl, 8086=auth, 8087=plugin-service, 8088=reasoner-worker, 8089=its own
# dataserver) so the replica can run standalone alongside an existing OntoCode
# stack on the same machine without a port clash.
server.port=${SERVER_PORT:9089}

# CORS — the replica frontend talks directly to this dataserver (no gateway
# in front of it), so the dataserver itself must grant the browser origin
# access. Comma-separated list of allowed origins.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3010,http://localhost:5173}

# Attachments/Files: multipart upload limits. Spring Boot's default (1MB
# file / 10MB request) is far too small for real attachments; the servlet
# container spools multipart parts to disk above spring.servlet.multipart.
# file-size-threshold, so this doesn't blow the container's heap cap.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Logging
# File path, rotation, and gzip are configured in logback-spring.xml.
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.self.research.ontology.dataserver=${LOGGING_LEVEL_APP:DEBUG}

# Management/Actuator — health, info, metrics, plus liveness/readiness groups
# since this service depends on MongoDB.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,mongo,diskSpace
